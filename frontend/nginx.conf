server {
    listen 8080;
    server_name _;
    absolute_redirect off;

    root /usr/share/nginx/html;
    index index.html;

    location = / {
        return 302 /herbalism/;
    }

    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /herbalism/index.html {
        add_header Cache-Control "no-store" always;
    }

    # Missing chunks must be 404, not the SPA document or a cached error.
    location ^~ /herbalism/static/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 子路徑 /herbalism/ 掛載 — SPA routing
    location /herbalism/ {
        try_files $uri $uri/ /herbalism/index.html;
    }

    # Redirect bare /herbalism -> /herbalism/
    location = /herbalism {
        return 301 /herbalism/;
    }

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Non-fingerprinted public assets revalidate rather than cache forever.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|json|map)$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }
}
