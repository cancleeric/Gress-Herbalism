server {
    listen 8080;
    server_name _;
    absolute_redirect off;
    root /usr/share/nginx/html;
    location = / { return 302 /herbalism/; }
    location = /herbalism { return 301 /herbalism/; }
    location = /healthz { return 200 "ok\n"; }
    location = /herbalism-api { return 308 /herbalism-api/; }
    location ^~ /herbalism-api/ {
        proxy_pass http://backend:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ^~ /herbalism/socket.io {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 90s;
        proxy_buffering off;
    }
    location = /herbalism/index.html { add_header Cache-Control "no-store" always; }
    location ^~ /herbalism/static/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location /herbalism/ { try_files $uri $uri/ /herbalism/index.html; }
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|json|map)$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }
}
