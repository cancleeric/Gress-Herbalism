# OFFLINE CANDIDATE. Live initialization requires separate formal authorization.
name: herbalism-local-issue3
services:
  db:
    image: postgres:15-bookworm
    environment:
      POSTGRES_DB: herbalism_db
      POSTGRES_USER: herbalism_owner
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets: [db_password]
    volumes: [pgdata:/var/lib/postgresql/data]
    networks: [data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U herbalism_owner -d herbalism_db']
      interval: 3s
      timeout: 3s
      retries: 30
  migration:
    image: herbalism-backend:local-issue3
    command: [node, scripts/migrate-local.cjs]
    env_file: ['${HERBALISM_OWNER_ENV:?Dedicated local owner env file required}']
    environment:
      HERBALISM_ENV: local-docker
      PG_SCHEMA: herbalism
    networks: [data]
    depends_on:
      db: {condition: service_healthy}
    restart: 'no'
  backend:
    image: herbalism-backend:local-issue3
    build: {context: ., dockerfile: backend/Dockerfile}
    env_file: ['${HERBALISM_APP_ENV:?Dedicated local app env file required}']
    environment:
      PORT: '8080'
      DB_PROVIDER: postgres
      PG_SCHEMA: herbalism
      PG_SSL_MODE: disable
      REALTIME_ONLY: '0'
      PERSISTENT_REPLAY: '1'
      SOCKET_PATH: /herbalism/socket.io
    networks: [data, edge]
    depends_on:
      migration: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, node, -e, 'fetch("http://localhost:8080/api/health").then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))']
      interval: 3s
      timeout: 3s
      retries: 30
  frontend:
    image: herbalism-frontend:local-issue3
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args: {PUBLIC_CONFIG_SHA256: '${PUBLIC_CONFIG_SHA256:?Public config hash required}'}
      secrets: [frontend_env]
    ports: ['${HERBALISM_BIND_IP:-127.0.0.1}:18322:8080']
    volumes: ['./frontend/nginx.local.conf:/etc/nginx/conf.d/default.conf:ro']
    networks: [edge]
    depends_on:
      backend: {condition: service_healthy}
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1:8080/healthz']
      interval: 3s
      timeout: 3s
      retries: 30
volumes:
  pgdata:
networks:
  data: {internal: true}
  edge:
secrets:
  db_password: {file: '${HERBALISM_DB_PASSWORD_FILE:?Dedicated local password file required}'}
  frontend_env: {file: '${HERBALISM_PUBLIC_ENV:?Public frontend build settings required}'}
